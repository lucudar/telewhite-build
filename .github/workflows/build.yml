name: Build Telewhite.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или коммит lucudar/tdesktop (пусто = из build-ref.txt)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'build-ref.txt'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}

    strategy:
      matrix:
        arch: [x64]
        qt: [""]
        # Ninja gives every file its own subset of lang keys, so adding
        # strings rebuilds only the files that use them (with the build cache).
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Build settings.
        uses: actions/checkout@v7
        with:
          path: cfg
          sparse-checkout: build-ref.txt
          sparse-checkout-cone-mode: false

      - name: Pick the source ref.
        shell: bash
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="$(head -n1 cfg/build-ref.txt | tr -d '\r[:space:]')"; fi
          if [ -z "$REF" ]; then REF="dev"; fi
          echo "SOURCE_REF=$REF" >> $GITHUB_ENV
          echo "REPO_NAME=tdesktop" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          repository: lucudar/tdesktop
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Source commit.
        shell: bash
        run: |
          SHA=$(git -C "$TBUILD/$REPO_NAME" rev-parse --short=10 HEAD)
          echo "SOURCE_SHA=$SHA" >> $GITHUB_ENV
          echo "Сборка lucudar/tdesktop: \`$SOURCE_REF\` @ \`$SHA\`" >> $GITHUB_STEP_SUMMARY

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # TBuild lives on C: (Windows Server 2025 runners have no separate D:)
      # and Release libraries are built in both configurations, so drop large
      # preinstalled toolchains the build never uses.
      - name: Free disk space on C.
        shell: pwsh
        run: |
          function Show-Free {
            $c = Get-PSDrive C
            'C: used {0:N1} GB, free {1:N1} GB' -f ($c.Used / 1GB), ($c.Free / 1GB)
          }
          Show-Free
          $dirs = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\ghcup',
            'C:\Miniconda',
            'C:\selenium',
            'C:\SeleniumWebDrivers',
            'C:\Program Files\Docker',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files (x86)\Google',
            'C:\Program Files\Google',
            'C:\Program Files\Mozilla Firefox',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\node',
            'C:\Program Files\dotnet',
            'C:\Program Files\LLVM',
            'C:\msys64',
            'C:\Strawberry',
            'C:\vcpkg',
            'C:\Program Files\R',
            'C:\Program Files\Amazon',
            'C:\Program Files\Azure Cosmos DB Emulator',
            'C:\Program Files\Microsoft SDKs\Azure',
            'C:\Program Files (x86)\Microsoft SDKs\Azure',
            'C:\Program Files\Microsoft SDKs\Service Fabric',
            'C:\Program Files\Microsoft Service Fabric',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            "$env:USERPROFILE\.rustup",
            "$env:USERPROFILE\.cargo"
          )
          # prepare.py brings its own msys64, perl and Rust, and makes its
          # Python venv from the default interpreter only.
          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($python -like 'C:\hostedtoolcache\windows\Python\*') {
            $dirs += @(Get-ChildItem 'C:\hostedtoolcache\windows\Python' -Directory |
              Where-Object { $python -notlike "$($_.FullName)\*" } |
              ForEach-Object FullName)
          }
          $dirs += @(Get-ChildItem 'C:\', 'C:\Program Files' -Directory -Filter 'Julia*' -ErrorAction SilentlyContinue |
            ForEach-Object FullName)
          $removals = foreach ($d in $dirs) {
            if ($d -and (Test-Path -LiteralPath $d)) {
              Start-Process cmd.exe -ArgumentList "/c rmdir /s /q `"$d`" 2>nul" -NoNewWindow -PassThru
            }
          }
          if ($removals) {
            $removals | Wait-Process
          }
          Get-ChildItem $env:TEMP -Filter *.tzst -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Show-Free

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-release-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-release-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-release-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-release-

      # Release libraries build breakpad's dump_syms, which needs ATL for the
      # pinned 14.44 toolset, while the runner image has ATL only for the latest.
      - name: ATL for the 14.44 toolset.
        if: matrix.arch == 'x64' && steps.cache-libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $arguments = "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL --quiet --norestart --nocache"
          $p = Start-Process -FilePath "$installer\setup.exe" -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h")) {
            Write-Error "ATL for the 14.44 toolset is missing after the install."
            exit 1
          }

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Disk space after libraries.
        if: success() || failure()
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Read configuration matrix.
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          ARTIFACT_NAME="Telewhite"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          ARTIFACT_NAME="${ARTIFACT_NAME} ${SOURCE_SHA}"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Use the repository API credentials."
            API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          elif [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        # Keep wallet_engine/tlottie sources: tdesktop_rust compiles them, and
        # pruning them left a cache whose stage keys stayed valid, so CMake
        # then failed with "Cannot find source file .../wallet_engine.cpp".
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/wallet_engine/*' -o -path '*/tlottie/*' ')' -type f ')' -o -empty ')' -delete

      # Save library caches right away, so a failing app build does not throw
      # away an hour of library compilation (post-job saves only on success).
      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-release-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-release-${{ env.CACHE_KEY }}

      # Four cl.exe processes on 16 GB ran out of heap (C1060) on the large
      # Telewhite sources, so give the compiler a pagefile on the roomy D:.
      - name: Pagefile for the compiler.
        if: env.ONLY_CACHE == 'false'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: 'D:'

      # Build cache: the out folder of the previous successful build. Sources
      # that did not change since that build get an old timestamp, so Ninja
      # rebuilds only the changed files and the files that depend on them.
      - name: Build cache.
        id: cache-build
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ matrix.arch }}-build-ninja-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-build-ninja-${{ env.CACHE_KEY }}-

      - name: Source timestamps for the build cache.
        if: env.ONLY_CACHE == 'false' && steps.cache-build.outputs.cache-matched-key != ''
        shell: python
        run: |
          import os, subprocess
          root = os.path.join(os.environ['TBUILD'], os.environ['REPO_NAME'])
          manifest = os.path.join(root, 'out', 'telewhite-sources.txt')
          if not os.path.isfile(manifest):
              print('No sources list in the build cache, full build.')
              raise SystemExit(0)
          old = {}
          with open(manifest, encoding='utf-8') as f:
              for line in f:
                  sha, _, path = line.rstrip('\n').partition(' ')
                  if path:
                      old[path] = sha
          listing = subprocess.run(
              ['git', '-C', root, 'ls-files', '-s', '-z', '--recurse-submodules'],
              capture_output=True, check=True).stdout.decode('utf-8')
          stamp = 1577836800 # 2020-01-01, older than anything in the build cache.
          same = 0
          changed = []
          for entry in listing.split('\0'):
              if not entry:
                  continue
              meta, _, path = entry.partition('\t')
              sha = meta.split(' ')[1]
              full = os.path.join(root, path)
              if old.get(path) == sha and os.path.isfile(full) and not os.path.islink(full):
                  os.utime(full, (stamp, stamp))
                  same += 1
              else:
                  changed.append(path)
          line = f'Unchanged since the cached build: {same}, changed or new: {len(changed)}.'
          print(line)
          for path in changed:
              print('  ' + path)
          # The list of rebuilt sources, readable without signing in.
          shown = [line] + changed[:50] + (['...'] if len(changed) > 50 else [])
          text = '\n'.join(shown).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Build cache sources::{text}')

      # Logs need sign-in, annotations do not: turn compiler and linker
      # errors into annotations of the run.
      - name: Problem matcher.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/telewhite-matcher.json" << 'EOF'
          {
            "problemMatcher": [
              {
                "owner": "telewhite-msvc",
                "pattern": [
                  {
                    "regexp": "^((?:\\s*\\d+>)?([^\\s].*?)\\((\\d+)(?:,\\s*(\\d+))?\\)\\s*:\\s+(?:fatal\\s+)?(error|warning)\\s*([A-Za-z]*\\d+)?\\s*:.*)$",
                    "message": 1, "file": 2, "line": 3, "column": 4, "severity": 5, "code": 6
                  }
                ]
              },
              {
                "owner": "telewhite-link",
                "pattern": [
                  {
                    "regexp": "^(\\s*\\S.*?\\s+:\\s+(?:Command line\\s+)?(?:fatal\\s+)?(error|warning)\\s+((?:LNK|D|U|RC|CVT)\\d+)\\s*:.*)$",
                    "message": 1, "severity": 2, "code": 3
                  }
                ]
              },
              {
                "owner": "telewhite-cmake",
                "pattern": [
                  {
                    "regexp": "^(CMake Error.*)$",
                    "message": 1
                  }
                ]
              }
            ]
          }
          EOF
          echo "::add-matcher::$RUNNER_TEMP/telewhite-matcher.json"

      - name: Telegram Desktop build.
        id: build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel -- -k 0 > %TBUILD%\telewhite-build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type %TBUILD%\telewhite-build.log
          exit /b %BUILD_EXIT%

      # Problem matchers keep at most 10 errors per step, and the linker
      # lists the missing symbols on lines they may skip: show the error
      # lines of the build log as annotations, they need no sign-in.
      - name: Build errors.
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Join-Path $env:TBUILD 'telewhite-build.log'
          if (!(Test-Path $log)) {
            Write-Output 'No build log.'
            exit 0
          }
          # Decorated names like (?Name@@YAXXZ) only repeat the readable ones.
          $lines = @(Get-Content $log |
            Where-Object { $_ -match '^FAILED: |: (fatal )?error |unresolved external|CMake Error' } |
            ForEach-Object { $_ -replace ' \(\?\S*\)', '' } |
            ForEach-Object { if ($_.Length -gt 1200) { $_.Substring(0, 1200) + ' ...' } else { $_ } } |
            Select-Object -Unique |
            Select-Object -First 27)
          $index = 0
          for ($i = 0; $i -lt $lines.Count; $i += 3) {
            $index++
            $chunk = ($lines[$i..([Math]::Min($i + 2, $lines.Count - 1))] -join "`n")
            $chunk = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Build errors ${index}::$chunk"
            if ($index -ge 9) { break }
          }
          Write-Output "Error lines: $($lines.Count)"

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact/
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 7

      # Keep the out folder after a successful build, and after a failed
      # build without a restored cache: then every object in it was built
      # from these sources, so the next run compiles only what is left.
      - name: Build cache size.
        id: out-size
        if: (success() || failure()) && env.ONLY_CACHE == 'false' && (steps.build.outcome == 'success' || (steps.build.outcome == 'failure' && steps.cache-build.outputs.cache-matched-key == ''))
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out"
          $size = (Get-ChildItem $out -Recurse -File -Force | Measure-Object Length -Sum).Sum / 1GB
          $line = 'Build folder: {0:N1} GB' -f $size
          Write-Output "::notice title=Build cache::$line"
          $line >> $env:GITHUB_STEP_SUMMARY
          # 19 GB on disk took 1.6 GB in the cache (run 41850726014).
          "big=$([int]($size -gt 30))" >> $env:GITHUB_OUTPUT

      # Drop the previous build cache first: the 10 GB cache limit evicts the
      # least recently used entries, and those may be the library caches.
      - name: Drop the previous build cache.
        if: (success() || failure()) && steps.build.outcome == 'success' && steps.cache-build.outputs.cache-matched-key != '' && steps.cache-build.outputs.cache-matched-key != steps.cache-build.outputs.cache-primary-key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "${{ steps.cache-build.outputs.cache-matched-key }}" --repo "$GITHUB_REPOSITORY" || echo "Could not delete the previous build cache."

      - name: Remember sources for the build cache.
        id: sources
        if: (success() || failure()) && env.ONLY_CACHE == 'false' && (steps.build.outcome == 'success' || (steps.build.outcome == 'failure' && steps.cache-build.outputs.cache-matched-key == '')) && steps.out-size.outputs.big == '0'
        shell: python
        run: |
          import os, subprocess
          root = os.path.join(os.environ['TBUILD'], os.environ['REPO_NAME'])
          listing = subprocess.run(
              ['git', '-C', root, 'ls-files', '-s', '-z', '--recurse-submodules'],
              capture_output=True, check=True).stdout.decode('utf-8')
          count = 0
          with open(os.path.join(root, 'out', 'telewhite-sources.txt'), 'w', encoding='utf-8', newline='\n') as f:
              for entry in listing.split('\0'):
                  if not entry:
                      continue
                  meta, _, path = entry.partition('\t')
                  f.write(meta.split(' ')[1] + ' ' + path + '\n')
                  count += 1
          print(f'Remembered {count} sources.')

      - name: Save build cache.
        if: (success() || failure()) && steps.sources.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ steps.cache-build.outputs.cache-primary-key }}
